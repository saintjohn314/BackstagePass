  <!-- BP lettering (drawn as paths so it never depends on installed fonts) -->
  <g transform="translate(122 318) scale(0.88)" fill="url(#letters)" stroke="#000" stroke-width="9" stroke-linejoin="round" fill-rule="evenodd" paint-order="stroke">
    <path fill-rule="evenodd" d="M0 0 H82 C122 0 136 18 136 42 C136 60 126 72 112 77 C130 82 142 96 142 118 C142 146 122 160 86 160 H0Z
             M44 36 V64 H78 C90 64 94 58 94 50 C94 42 90 36 78 36Z
             M44 96 V124 H82 C96 124 100 118 100 110 C100 102 96 96 82 96Z"/>
    <path fill-rule="evenodd" d="M160 0 H246 C286 0 304 24 304 56 C304 88 286 112 246 112 H206 V160 H160Z
             M206 38 V74 H240 C254 74 260 66 260 56 C260 46 254 38 240 38Z"/>
  </g>
  <!-- Letter counters drawn on top so they always read at small sizes -->
  <g transform="translate(122 318) scale(0.88)" fill="#0b0909">
    <path d="M44 34 V64 H78 C90 64 94 58 94 49 C94 40 90 34 78 34Z"/>
    <path d="M44 96 V126 H82 C96 126 100 120 100 111 C100 102 96 96 82 96Z"/>
    <path d="M206 36 V76 H240 C254 76 260 67 260 56 C260 45 254 36 240 36Z"/>
