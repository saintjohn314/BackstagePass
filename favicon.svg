    <rect x="240" y="28" width="32" height="200" rx="4" fill="#111"/>
    <rect x="243" y="28" width="26" height="200" fill="#1c1c1c"/>
    <g stroke="#8a8a8a" stroke-width="3">
      <line x1="243" y1="70" x2="269" y2="70"/><line x1="243" y1="104" x2="269" y2="104"/>
      <line x1="243" y1="136" x2="269" y2="136"/><line x1="243" y1="166" x2="269" y2="166"/><line x1="243" y1="194" x2="269" y2="194"/>
    </g>
    <path d="M232 -14 h48 l6 46 h-60z" fill="#0a0a0a" stroke="#d0140c" stroke-width="4"/>
    <circle cx="226" cy="0" r="6" fill="#c9c9c9"/><circle cx="226" cy="22" r="6" fill="#c9c9c9"/>
    <circle cx="286" cy="0" r="6" fill="#c9c9c9"/><circle cx="286" cy="22" r="6" fill="#c9c9c9"/>
    <!-- body -->
    <path d="M256 196 C200 196 168 224 172 262 C175 286 190 296 186 316 C180 344 162 360 168 394 C176 440 220 462 256 462 C292 462 336 440 344 394 C350 360 332 344 326 316 C322 296 337 286 340 262 C344 224 312 196 256 196Z" fill="url(#body)" stroke="#000" stroke-width="10"/>
    <!-- black pickguard -->
    <path d="M276 300 C306 304 320 330 316 360 C312 392 290 410 268 412 L262 300Z" fill="#0a0a0a"/>
    <!-- pickups, bridge, strings -->
    <rect x="226" y="282" width="60" height="22" rx="5" fill="#111" stroke="#555" stroke-width="2"/>
    <rect x="226" y="330" width="60" height="22" rx="5" fill="#111" stroke="#555" stroke-width="2"/>
    <rect x="222" y="384" width="68" height="12" rx="3" fill="#cfcfcf"/>
    <g stroke="#e6e6e6" stroke-width="1.6" opacity="0.85">
      <line x1="248" y1="30" x2="246" y2="390"/><line x1="253" y1="30" x2="252" y2="390"/><line x1="259" y1="30" x2="260" y2="390"/><line x1="264" y1="30" x2="266" y2="390"/>
    </g>
    <circle cx="308" cy="408" r="9" fill="#111" stroke="#666" stroke-width="2"/>
    <circle cx="326" cy="380" r="9" fill="#111" stroke="#666" stroke-width="2"/>
